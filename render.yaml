# Render Blueprint：GitHub repo → 部署一個免費 Node 服務
# 將此 repo 推上 GitHub 後，在 render.com 新增 Blueprint 即可自動套用這些設定。
services:
  - type: web
    name: classroom-chat
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 小幫手智慧答詢（選用）：填入後自動啟用
      # - key: CHAT_LLM_BASE_URL
      #   sync: false
      # - key: CHAT_LLM_MODEL
      #   sync: false
      # - key: CHAT_LLM_API_KEY
      #   sync: false
